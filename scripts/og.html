<!doctype html>
<!-- Open Graph image template. Not published (scripts/ is excluded).
     Render: see README, "Open Graph images". ?p=home, ?p=arro or ?p=bowyer -->
<html lang="en" data-theme="light" class="js">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 40px; padding: 0 70px; }
  .og h1 { font-size: 112px; }
  .og h1 .l2 { display: block; padding-left: 0.45em; }
  .og .sub { margin-top: 26px; font-size: 30px; font-weight: 700; max-width: 22ch; line-height: 1.25; }
  .og .sub em { font-style: normal; font-weight: 500; color: var(--ink-2); }
  .fronts { display: grid; grid-template-columns: repeat(2, 150px); gap: 18px; transform: rotate(-4deg); }
  .front { position: relative; width: 150px; height: 198px; overflow: hidden; box-shadow: 8px 8px 0 #14151822; }
  .front canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .front b { position: absolute; left: 10px; top: 8px; font-size: 28px; color: #fff; font-weight: 900; font-style: italic; font-variation-settings: "wdth" 125; }
  .front[data-p="tunetop"] b { color: #141518; }
  .arro-og { grid-template-columns: 1fr 360px; }
  .arro-og .big { position: relative; width: 360px; height: 476px; overflow: hidden; transform: rotate(-3deg); box-shadow: 14px 14px 0 #14151826; }
  .arro-og .big canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arro-og .big b { position: absolute; left: 24px; top: 18px; font-size: 76px; color: #fff; font-weight: 900; font-style: italic; font-variation-settings: "wdth" 125; }
  .arro-og h1 { font-size: 150px; }
  .bowyer-og h1 { font-size: 124px; }
  .bowyer-og .big b { font-size: 60px; color: #141518; }
  .tag { display: inline-flex; margin-top: 28px; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 22px; font-weight: 800; }
</style>
</head>
<body>
<div id="og"></div>
<script>
  const p = new URLSearchParams(location.search).get("p") || "home";
  const og = document.getElementById("og");
  if (p === "arro") {
    og.className = "og arro-og";
    og.innerHTML = `<div><h1 class="brand">Arro</h1><p class="sub">A native Java IDE written in Rust. <em>IntelliJ-style shortcuts, a GPU-rendered UI, a fraction of the memory.</em></p><span class="tag">Free · Windows · Linux · macOS</span></div>
      <div class="big"><canvas data-art="arro" data-t="2.2"></canvas><b>Arro</b></div>`;
  } else if (p === "bowyer") {
    og.className = "og arro-og bowyer-og";
    og.innerHTML = `<div><h1 class="brand">Bowyer</h1><p class="sub">Every AI coding agent, one native window. <em>Claude Code, Codex, OpenCode and DeepSeek sessions, local and over SSH.</em></p><span class="tag">Free · Windows · Linux · macOS</span></div>
      <div class="big"><canvas data-art="bowyer" data-t="0.6"></canvas><b>Bowyer</b></div>`;
  } else {
    og.className = "og";
    og.innerHTML = `<div><h1 class="brand">Paweł<span class="l2">Januszko</span></h1><p class="sub">Rust &amp; Java · native desktop tools and local AI. <em>Arro, Dictate, Tunetop, AI Translator.</em></p></div>
      <div class="fronts">${["arro", "dictate", "tunetop", "ai-translator"].map((k) => `<div class="front" data-p="${k}"><canvas data-art="${k}" data-t="2.2"></canvas><b>${{ arro: "Arro", dictate: "Dictate", tunetop: "Tunetop", "ai-translator": "AI" }[k]}</b></div>`).join("")}</div>`;
  }
  const s = document.createElement("script");
  s.src = "/assets/js/boxes.js";
  document.body.append(s);
</script>
</body>
</html>
